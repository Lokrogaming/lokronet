# nginx für net.lokro.dev – bedient /install, /dl und den Rendezvous-Proxy.
# Auf dem Server nach /etc/nginx/sites-available/net.lokro.dev kopieren,
# dann: ln -s ... /etc/nginx/sites-enabled/ && certbot --nginx -d net.lokro.dev
#
# Verzeichnislayout auf dem Server (Beispiel):
#   /srv/lokro-web/install  -> Kopie von deploy/install.sh
#   /srv/lokro-web/dl/      -> Inhalt von dist/ (tarballs + checksums.txt)

server {
    listen 80;
    server_name net.lokro.dev;

    # Installer-Script (exakt diese URL kommt in die Doku)
    location = /install {
        alias /srv/lokro-web/install;
        default_type text/plain;
    }

    # Release-Artefakte
    location /dl/ {
        alias /srv/lokro-web/dl/;
        autoindex on;
    }

    # Rendezvous hinter TLS (Client nutzt: --rendezvous https://net.lokro.dev)
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8787;
    }
}
